name: coverage-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Fast-fail release metadata preflight runs BEFORE the ~2+ minute coverage gate
      # so missing version bumps, wrapper drift, and changelog misses surface locally
      # and in CI before the full test suite starts.
      - name: Release preflight (PRs only)
        if: github.event_name == 'pull_request'
        run: npm run release:preflight -- --base-ref "origin/${{ github.base_ref }}"

      - name: Run Coverage Gate
        run: npm run test:coverage

      - name: Resolve Coverage Artifact Root
        if: always()
        run: |
          COVERAGE_ARTIFACT_ROOT=$(node - <<'NODE'
          const { tmpdir } = require('os')
          const { join } = require('path')
          console.log(join(tmpdir(), 'ouroboros-test-runs', 'ouroboros-agent-harness'))
          NODE
          )
          echo "COVERAGE_ARTIFACT_ROOT=${COVERAGE_ARTIFACT_ROOT}" >> "$GITHUB_ENV"

      - name: Upload Coverage Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-gate-artifacts
          path: ${{ env.COVERAGE_ARTIFACT_ROOT }}
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Hermetic Integration Lane
        run: npm run test:integration

  package-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Local Package E2E Lane
        run: |
          npm run test:e2e:package
          npm run test:e2e:ouro-bot-package

      - name: Build Packaged Unraid Image
        run: |
          PACKAGE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PACKAGE_ROOT"' EXIT
          npm pack --pack-destination "$PACKAGE_ROOT" >/dev/null
          PACKAGE_TARBALL="$(find "$PACKAGE_ROOT" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          tar -xzf "$PACKAGE_TARBALL" -C "$PACKAGE_ROOT"
          node scripts/package-assets.cjs "$PACKAGE_ROOT/package"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          docker build --pull --no-cache --file "$PACKAGE_ROOT/package/deploy/unraid/Dockerfile" --tag ouro-butler-package-smoke:"$PACKAGE_VERSION" "$PACKAGE_ROOT/package"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 --entrypoint /bin/sh ouro-butler-package-smoke:"$PACKAGE_VERSION" -ceu '
            BW_VERIFY_ROOT="$(mktemp -d)"
            trap '\''rm -rf -- "$BW_VERIFY_ROOT"'\'' 0
            mkdir "$BW_VERIFY_ROOT/appdata"
            printf "%s" "{}" >"$BW_VERIFY_ROOT/appdata/data.json"
            test ! -e "/home/ouro/.config/Bitwarden CLI"
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            command -v bw >/dev/null
            BW_VERSION="$(BITWARDENCLI_APPDATA_DIR="$BW_VERIFY_ROOT/appdata" bw --version 2>"$BW_VERIFY_ROOT/stderr")"
            test ! -s "$BW_VERIFY_ROOT/stderr"
            test "$BW_VERSION" = 2026.6.0
            rm -rf -- "$BW_VERIFY_ROOT"
            trap - 0
            test ! -e "/home/ouro/.config/Bitwarden CLI"
          '
          docker run --rm --entrypoint node ouro-butler-package-smoke:"$PACKAGE_VERSION" -e '
            const expected = process.argv[1]
            const packageVersion = require("/opt/ouro/package.json").version
            const shrinkwrap = require("/opt/ouro/npm-shrinkwrap.json")
            if (packageVersion !== expected || shrinkwrap.version !== expected || shrinkwrap.packages[""].version !== expected) process.exit(1)
          ' "$PACKAGE_VERSION"
          AUDIT_PERMISSION_ROOT="$PACKAGE_ROOT/audit-permissions"
          mkdir "$AUDIT_PERMISSION_ROOT"
          chmod 0700 "$AUDIT_PERMISSION_ROOT"
          umask 077
          AUDIT_IMAGE_ID="$(docker image inspect --format '{{.Id}}' ouro-butler-package-smoke:"$PACKAGE_VERSION")"
          for AUDIT_SOURCE in \
            /mnt/user/appdata/ouro-butler/runtime/.ouro-cli \
            /mnt/user/appdata/ouro-butler/agent/sanctuary.ouro \
            /boot/config/custom/ouro-events/spool; do
            test ! -e "$AUDIT_SOURCE"
          done
          sudo mkdir -p \
            /mnt/user/appdata/ouro-butler/runtime/.ouro-cli \
            /mnt/user/appdata/ouro-butler/agent/sanctuary.ouro \
            /boot/config/custom/ouro-events/spool
          trap 'docker rm -f ouro-butler-package-audit-canonical >/dev/null 2>&1 || true; sudo rm -rf -- /mnt/user/appdata/ouro-butler/runtime/.ouro-cli /mnt/user/appdata/ouro-butler/agent/sanctuary.ouro /boot/config/custom/ouro-events/spool; sudo rm -rf -- "$PACKAGE_ROOT"' EXIT
          docker create --name ouro-butler-package-audit-canonical --network host --restart unless-stopped --user 10001:10001 \
            --mount type=bind,src=/mnt/user/appdata/ouro-butler/runtime/.ouro-cli,dst=/home/ouro/.ouro-cli \
            --mount type=bind,src=/mnt/user/appdata/ouro-butler/agent/sanctuary.ouro,dst=/home/ouro/AgentBundles/sanctuary.ouro \
            --mount type=bind,src=/boot/config/custom/ouro-events/spool,dst=/run/ouro-events,readonly \
            ouro-butler-package-smoke:"$PACKAGE_VERSION"
          docker inspect ouro-butler-package-audit-canonical >"$AUDIT_PERMISSION_ROOT/container.json"
          docker image inspect "$AUDIT_IMAGE_ID" >"$AUDIT_PERMISSION_ROOT/image.json"
          cp "$PACKAGE_ROOT/package/deploy/unraid/container-runtime.json" "$AUDIT_PERMISSION_ROOT/container-runtime.json"
          node - "$PACKAGE_ROOT/package/deploy/unraid/sanctuary.xml" "$AUDIT_PERMISSION_ROOT/sanctuary.xml" "$AUDIT_IMAGE_ID" <<'NODE'
          const fs = require('fs')
          const [source, destination, imageId] = process.argv.slice(2)
          const template = fs.readFileSync(source, 'utf8')
          const updated = template.replace(/<Repository>[^<]+<\/Repository>/u, `<Repository>${imageId}</Repository>`)
          if (updated === template) throw new Error('staged template Repository was not replaced')
          fs.writeFileSync(destination, updated)
          NODE
          chmod 0600 "$AUDIT_PERMISSION_ROOT"/*.json "$AUDIT_PERMISSION_ROOT/sanctuary.xml"
          sudo chown root:root "$AUDIT_PERMISSION_ROOT"/*
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$AUDIT_PERMISSION_ROOT/container.json,dst=/audit/container.json,readonly" \
            --entrypoint /bin/cat ouro-butler-package-smoke:"$PACKAGE_VERSION" /audit/container.json >/dev/null 2>&1; then
            echo "default image UID unexpectedly read the root-private audit input" >&2
            exit 1
          fi
          set +e
          EFFECTIVE_RESULT=$(docker run --rm --network none --user 0:0 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/ouro/deploy/unraid/audit-container-spec.sh \
            --mount "type=bind,src=$AUDIT_PERMISSION_ROOT/container.json,dst=/audit/container.json,readonly" \
            --mount "type=bind,src=$AUDIT_PERMISSION_ROOT/image.json,dst=/audit/image.json,readonly" \
            ouro-butler-package-smoke:"$PACKAGE_VERSION" \
            --inspect /audit/container.json --image-inspect /audit/image.json --expected-image "$AUDIT_IMAGE_ID" \
            2>&1)
          AUDIT_STATUS=$?
          set -e
          test "$AUDIT_STATUS" = 0
          printf '%s\n' "$EFFECTIVE_RESULT" | grep -F '"ok":true'
          if printf '%s\n' "$EFFECTIVE_RESULT" | grep -F "inputs are unreadable"; then
            echo "constrained root could not read effective audit inputs" >&2
            exit 1
          fi
          set +e
          STAGED_RESULT=$(docker run --rm --network none --user 0:0 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/ouro/deploy/unraid/audit-container-spec.sh \
            --mount "type=bind,src=$AUDIT_PERMISSION_ROOT/sanctuary.xml,dst=/audit/sanctuary.xml,readonly" \
            --mount "type=bind,src=$AUDIT_PERMISSION_ROOT/container-runtime.json,dst=/audit/container-runtime.json,readonly" \
            ouro-butler-package-smoke:"$PACKAGE_VERSION" \
            --template /audit/sanctuary.xml --runtime-policy /audit/container-runtime.json --expected-image "$AUDIT_IMAGE_ID" \
            2>&1)
          STAGED_AUDIT_STATUS=$?
          set -e
          test "$STAGED_AUDIT_STATUS" = 0
          printf '%s\n' "$STAGED_RESULT" | grep -F '"ok":true'
          if printf '%s\n' "$STAGED_RESULT" | grep -F "inputs are unreadable"; then
            echo "constrained root could not read staged audit inputs" >&2
            exit 1
          fi
          LEGACY_ALPHA742_IMAGE_ID=sha256:681449ad47a2621705cd339b481e6339236b31dc65e195b1cf5025d0f2191d7d
          SNAPSHOT_ROOT="$PACKAGE_ROOT/legacy-snapshot"
          SNAPSHOT_VERIFIER="$PACKAGE_ROOT/verify-snapshot.sh"
          awk '
            /^    verify_sanctuary_snapshot_provenance\(\) \{/ { active = 1 }
            active {
              ending = ($0 == "    }")
              sub(/^    /, "")
              print
              if (ending) active = 0
            }
          ' "$PACKAGE_ROOT/package/deploy/unraid/README.txt" >"$SNAPSHOT_VERIFIER"
          grep -Fq 'verify_sanctuary_snapshot_provenance() {' "$SNAPSHOT_VERIFIER"
          sudo install -d -m 0700 -o 0 -g 0 \
            "$SNAPSHOT_ROOT" \
            "$SNAPSHOT_ROOT/runtime" \
            "$SNAPSHOT_ROOT/agent" \
            "$SNAPSHOT_ROOT/host" \
            "$SNAPSHOT_ROOT/provenance" \
            "$SNAPSHOT_ROOT/host/custom" \
            "$SNAPSHOT_ROOT/host/custom/ouro-events"
          for SNAPSHOT_FILE in \
            "$SNAPSHOT_ROOT/host/inventory" \
            "$SNAPSHOT_ROOT/host/go.butler-lines" \
            "$SNAPSHOT_ROOT/host/crontab.butler-lines" \
            "$SNAPSHOT_ROOT/host/global-state" \
            "$SNAPSHOT_ROOT/provenance/image-id" \
            "$SNAPSHOT_ROOT/provenance/container-inspect.json" \
            "$SNAPSHOT_ROOT/provenance/image-inspect.json" \
            "$SNAPSHOT_ROOT/provenance/package-version" \
            "$SNAPSHOT_ROOT/provenance/manifest.sha256"; do
            sudo install -m 0600 -o 0 -g 0 /dev/null "$SNAPSHOT_FILE"
          done
          sudo tee "$SNAPSHOT_ROOT/host/inventory" >/dev/null <<'EOF'
          absent	custom/usenet_health.sh
          absent	custom/ouro-events/bootstrap-spool.sh
          absent	custom/ouro-events/emit-event.mjs
          absent	custom/ouro-events/emit-usenet-event.sh
          absent	custom/ouro-events/install-usenet-guard.sh
          present	go.butler-lines
          present	crontab.butler-lines
          present	global-state
          EOF
          sudo tee "$SNAPSHOT_ROOT/host/global-state" >/dev/null <<'EOF'
          go	absent	-	0
          crontab	absent	-	0
          EOF
          printf '%s\n' "$LEGACY_ALPHA742_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/image-id" >/dev/null
          printf '[{"Image":"%s"}]\n' "$LEGACY_ALPHA742_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/container-inspect.json" >/dev/null
          printf '[{"Id":"%s","Config":{"Labels":{}}}]\n' "$LEGACY_ALPHA742_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/image-inspect.json" >/dev/null
          printf '%s\n' "$PACKAGE_VERSION" | sudo tee "$SNAPSHOT_ROOT/provenance/package-version" >/dev/null
          sudo sh -ceu 'cd "$1"; find runtime agent host provenance -xdev -type f ! -path provenance/manifest.sha256 -exec sha256sum -- {} + | LC_ALL=C sort -k2 >provenance/manifest.sha256' snapshot-manifest "$SNAPSHOT_ROOT"
          docker run --rm --network none --user 0:0 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --mount "type=bind,src=$SNAPSHOT_ROOT,dst=/snapshot,readonly" \
            --mount "type=bind,src=$SNAPSHOT_VERIFIER,dst=/verify-snapshot.sh,readonly" \
            --entrypoint /bin/bash ouro-butler-package-smoke:"$PACKAGE_VERSION" -ceu \
            'source /verify-snapshot.sh; verify_sanctuary_snapshot_provenance /snapshot "$1"' \
            -- "$LEGACY_ALPHA742_IMAGE_ID"
          printf '%s\n' "$AUDIT_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/image-id" >/dev/null
          printf '[{"Image":"%s"}]\n' "$AUDIT_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/container-inspect.json" >/dev/null
          printf '[{"Id":"%s","Config":{"Labels":{}}}]\n' "$AUDIT_IMAGE_ID" | sudo tee "$SNAPSHOT_ROOT/provenance/image-inspect.json" >/dev/null
          sudo sh -ceu 'cd "$1"; find runtime agent host provenance -xdev -type f ! -path provenance/manifest.sha256 -exec sha256sum -- {} + | LC_ALL=C sort -k2 >provenance/manifest.sha256' snapshot-manifest "$SNAPSHOT_ROOT"
          set +e
          docker run --rm --network none --user 0:0 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --mount "type=bind,src=$SNAPSHOT_ROOT,dst=/snapshot,readonly" \
            --mount "type=bind,src=$SNAPSHOT_VERIFIER,dst=/verify-snapshot.sh,readonly" \
            --entrypoint /bin/bash ouro-butler-package-smoke:"$PACKAGE_VERSION" -ceu \
            'source /verify-snapshot.sh; verify_sanctuary_snapshot_provenance /snapshot "$1"' \
            -- "$AUDIT_IMAGE_ID"
          UNLABELED_CURRENT_STATUS=$?
          set -e
          test "$UNLABELED_CURRENT_STATUS" != 0

  publish:
    needs:
      - coverage
      - integration
      - package-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing toolchain (trusted publishing requires npm >=11.5.1 on Node >=22.14)
        run: |
          node <<'NODE'
          const { execFileSync } = require("child_process")

          const minimum = [11, 5, 1]
          const fallback = "11.6.4"

          function parse(version) {
            return version.split(".").map((part) => Number.parseInt(part, 10))
          }

          function isAtLeast(version, floor) {
            const parsed = parse(version)
            return floor.every((value, index) => (parsed[index] ?? 0) === value)
              || parsed.some((value, index) => value !== floor[index] && value > (floor[index] ?? 0) && parsed.slice(0, index).every((part, prior) => part === floor[prior]))
          }

          function npmVersion() {
            return execFileSync("npm", ["--version"], { encoding: "utf8" }).trim()
          }

          const current = npmVersion()
          if (isAtLeast(current, minimum)) {
            console.log(`npm ${current} satisfies the trusted-publishing floor`)
            process.exit(0)
          }

          console.log(`npm ${current} is below the trusted-publishing floor; installing pinned fallback npm@${fallback}`)
          execFileSync("npm", ["install", "-g", `npm@${fallback}`], { stdio: "inherit" })
          const updated = npmVersion()
          if (!isAtLeast(updated, minimum)) {
            throw new Error(`npm ${updated} is still below the trusted-publishing floor after fallback install`)
          }
          console.log(`npm ${updated} satisfies the trusted-publishing floor`)
          NODE

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve @ouro.bot/cli publish tag
        id: cli-publish-tag
        run: |
          TAG=$(node scripts/npm-dist-tag-policy.cjs publish-tag "@ouro.bot/cli" "$(node -p "require('./package.json').version")")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publishing @ouro.bot/cli with dist-tag ${TAG}"

      - name: Publish @ouro.bot/cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          TAG="${{ steps.cli-publish-tag.outputs.tag }}"
          PUBLISHED=$(npm view "@ouro.bot/cli@${LOCAL}" version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "@ouro.bot/cli@${LOCAL} already published — skipping"
          else
            npm publish --access public --tag "$TAG"
          fi

      - name: Build for wrapper publish guard
        run: npm run build

      - name: Check ouro.bot wrapper publish needed
        id: wrapper-check
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const { execSync } = require('child_process')
          const { assessWrapperPublishSync } = require('./dist/heart/versioning/wrapper-publish-guard.js')

          const changedFiles = execSync(
            'git diff-tree --no-commit-id --name-only -r HEAD -- packages/ouro.bot/',
            { encoding: 'utf-8' },
          ).trim().split('\n').filter(Boolean)

          const localVersion = require('./packages/ouro.bot/package.json').version
          const cliVersion = require('./package.json').version
          let publishedVersion = ''
          try {
            publishedVersion = execSync(`npm view "ouro.bot@${localVersion}" version`, {
              encoding: 'utf-8',
              stdio: ['ignore', 'pipe', 'ignore'],
            }).trim()
          } catch {
            publishedVersion = ''
          }

          const result = assessWrapperPublishSync({ changedFiles, localVersion, cliVersion, publishedVersion })
          if (!result.ok) {
            console.error(result.message)
            process.exit(1)
          }
          if (publishedVersion === localVersion) {
            console.log(`ouro.bot@${localVersion} already published — skipping`)
            process.exit(0)
          }
          console.log(result.message)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=true\n')
          NODE

      - name: Resolve ouro.bot wrapper publish tag
        id: wrapper-publish-tag
        run: |
          TAG=$(node scripts/npm-dist-tag-policy.cjs publish-tag "ouro.bot" "$(node -p "require('./packages/ouro.bot/package.json').version")")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publishing ouro.bot with dist-tag ${TAG}"

      - name: Publish ouro.bot
        if: steps.wrapper-check.outputs.should_publish == 'true'
        run: |
          cd packages/ouro.bot
          npm publish --access public --tag "${{ steps.wrapper-publish-tag.outputs.tag }}"

      - name: Verify selected npm dist-tags
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          CLI_TAG="${{ steps.cli-publish-tag.outputs.tag }}"
          WRAPPER_TAG="${{ steps.wrapper-publish-tag.outputs.tag }}"

          verify_tag() {
            package_ref="$1"
            expected="$2"

            for attempt in 1 2 3 4 5 6; do
              actual=$(npm view "$package_ref" version 2>/dev/null || echo "")
              if [ "$actual" = "$expected" ]; then
                echo "${package_ref} verified at ${expected}"
                return 0
              fi

              if [ "$attempt" != "6" ]; then
                echo "${package_ref} points at ${actual:-missing}, expected ${expected}; retrying after npm propagation delay"
                sleep 10
              fi
            done

            echo "::error::${package_ref} points at ${actual:-missing}, expected ${expected}"
            return 1
          }

          verify_tag "@ouro.bot/cli@${CLI_TAG}" "$LOCAL"
          verify_tag "ouro.bot@${WRAPPER_TAG}" "$LOCAL"

          echo "selected npm dist-tags verified for ${LOCAL} (cli=${CLI_TAG}, wrapper=${WRAPPER_TAG})"

      - name: Smoke published package binaries
        run: npm run release:smoke
