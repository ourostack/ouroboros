name: coverage-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Fast-fail release metadata preflight runs BEFORE the ~2+ minute coverage gate
      # so missing version bumps, wrapper drift, and changelog misses surface locally
      # and in CI before the full test suite starts.
      - name: Release preflight (PRs only)
        if: github.event_name == 'pull_request'
        run: npm run release:preflight -- --base-ref "origin/${{ github.base_ref }}"

      - name: Run Coverage Gate
        run: npm run test:coverage

      - name: Resolve Coverage Artifact Root
        if: always()
        run: |
          COVERAGE_ARTIFACT_ROOT=$(node - <<'NODE'
          const { tmpdir } = require('os')
          const { join } = require('path')
          console.log(join(tmpdir(), 'ouroboros-test-runs', 'ouroboros-agent-harness'))
          NODE
          )
          echo "COVERAGE_ARTIFACT_ROOT=${COVERAGE_ARTIFACT_ROOT}" >> "$GITHUB_ENV"

      - name: Upload Coverage Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-gate-artifacts
          path: ${{ env.COVERAGE_ARTIFACT_ROOT }}
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Hermetic Integration Lane
        run: npm run test:integration

  package-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Local Package E2E Lane
        run: npm run test:e2e:package

  trust-coverage:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - macos-26-intel
    steps:
      - name: Checkout trust TCB
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Use pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.4.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run trust TCB V8 coverage
        run: |
          npm exec -- vitest run \
            tests/release-trust-bootstrap.contract.test.ts \
            tests/release-trust-bootstrap-coverage.contract.test.ts \
            tests/developer-id-pair-canary-workflow.contract.test.ts \
            tests/developer-id-signing-workflow.contract.test.ts \
            --coverage.enabled=true \
            --coverage.provider=v8 \
            --coverage.include=.github/actions/release-trust/canonicalize.mjs \
            --coverage.include=.github/actions/release-trust/protected-store.mjs \
            --coverage.include=.github/actions/release-trust/workflow-closure.mjs \
            --coverage.include=.github/actions/release-trust/run-reconciliation.mjs \
            --coverage.thresholds.lines=100 \
            --coverage.thresholds.branches=100 \
            --coverage.thresholds.functions=100 \
            --coverage.thresholds.statements=100

      - name: Run native trust coverage
        run: |
          set -euo pipefail
          mkdir -p trust-native-coverage
          OURO_PAIR_PROFILE_FILE="$PWD/trust-native-coverage/pair-%p.profraw" \
          OURO_SIGNING_PROFILE_FILE="$PWD/trust-native-coverage/signing-%p.profraw" \
            npm exec -- vitest run \
            tests/native/developer-id-pair-canary.test.ts \
            tests/native/developer-id-signing.test.ts
          xcrun --sdk macosx clang -std=c17 -Wall -Wextra -Werror \
            -DOURO_NATIVE_COVERAGE -fprofile-instr-generate -fcoverage-mapping \
            "$PWD/native/developer-id-pair-canary/driver.c" \
            -framework Security -framework CoreFoundation \
            -o trust-native-coverage/pair-canary
          xcrun --sdk macosx clang -std=c17 -Wall -Wextra -Werror \
            -DOURO_NATIVE_COVERAGE -fprofile-instr-generate -fcoverage-mapping \
            "$PWD/native/developer-id-signing/driver.c" \
            -framework Security -framework CoreFoundation \
            -o trust-native-coverage/signing
          xcrun llvm-profdata merge -sparse trust-native-coverage/*.profraw \
            -o trust-native-coverage/merged.profdata
          xcrun llvm-cov report trust-native-coverage/pair-canary \
            -object trust-native-coverage/signing \
            -instr-profile trust-native-coverage/merged.profdata \
            --show-branch-summary
          xcrun llvm-cov export trust-native-coverage/pair-canary \
            -object trust-native-coverage/signing \
            -instr-profile trust-native-coverage/merged.profdata \
            -summary-only > trust-native-coverage/summary.json
          node <<'NODE'
          const summary = require('./trust-native-coverage/summary.json').data[0].totals
          for (const key of ['lines', 'branches', 'functions']) {
            if (summary[key].percent !== 100) throw new Error(`${key} coverage ${summary[key].percent}%`)
          }
          console.log('lines: 100.00%')
          console.log('branches: 100.00%')
          console.log('functions: 100.00%')
          NODE

  publish:
    needs:
      - coverage
      - integration
      - package-e2e
      - trust-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing toolchain (trusted publishing requires npm >=11.5.1 on Node >=22.14)
        run: |
          node <<'NODE'
          const { execFileSync } = require("child_process")

          const minimum = [11, 5, 1]
          const fallback = "11.6.4"

          function parse(version) {
            return version.split(".").map((part) => Number.parseInt(part, 10))
          }

          function isAtLeast(version, floor) {
            const parsed = parse(version)
            return floor.every((value, index) => (parsed[index] ?? 0) === value)
              || parsed.some((value, index) => value !== floor[index] && value > (floor[index] ?? 0) && parsed.slice(0, index).every((part, prior) => part === floor[prior]))
          }

          function npmVersion() {
            return execFileSync("npm", ["--version"], { encoding: "utf8" }).trim()
          }

          const current = npmVersion()
          if (isAtLeast(current, minimum)) {
            console.log(`npm ${current} satisfies the trusted-publishing floor`)
            process.exit(0)
          }

          console.log(`npm ${current} is below the trusted-publishing floor; installing pinned fallback npm@${fallback}`)
          execFileSync("npm", ["install", "-g", `npm@${fallback}`], { stdio: "inherit" })
          const updated = npmVersion()
          if (!isAtLeast(updated, minimum)) {
            throw new Error(`npm ${updated} is still below the trusted-publishing floor after fallback install`)
          }
          console.log(`npm ${updated} satisfies the trusted-publishing floor`)
          NODE

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve @ouro.bot/cli publish tag
        id: cli-publish-tag
        run: |
          TAG=$(node scripts/npm-dist-tag-policy.cjs publish-tag "@ouro.bot/cli" "$(node -p "require('./package.json').version")")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publishing @ouro.bot/cli with dist-tag ${TAG}"

      - name: Publish @ouro.bot/cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          TAG="${{ steps.cli-publish-tag.outputs.tag }}"
          PUBLISHED=$(npm view "@ouro.bot/cli@${LOCAL}" version 2>/dev/null || echo "")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "@ouro.bot/cli@${LOCAL} already published — skipping"
          else
            npm publish --access public --tag "$TAG"
          fi

      - name: Build for wrapper publish guard
        run: npm run build

      - name: Check ouro.bot wrapper publish needed
        id: wrapper-check
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const { execSync } = require('child_process')
          const { assessWrapperPublishSync } = require('./dist/heart/versioning/wrapper-publish-guard.js')

          const changedFiles = execSync(
            'git diff-tree --no-commit-id --name-only -r HEAD -- packages/ouro.bot/',
            { encoding: 'utf-8' },
          ).trim().split('\n').filter(Boolean)

          const localVersion = require('./packages/ouro.bot/package.json').version
          const cliVersion = require('./package.json').version
          let publishedVersion = ''
          try {
            publishedVersion = execSync(`npm view "ouro.bot@${localVersion}" version`, {
              encoding: 'utf-8',
              stdio: ['ignore', 'pipe', 'ignore'],
            }).trim()
          } catch {
            publishedVersion = ''
          }

          const result = assessWrapperPublishSync({ changedFiles, localVersion, cliVersion, publishedVersion })
          if (!result.ok) {
            console.error(result.message)
            process.exit(1)
          }
          if (publishedVersion === localVersion) {
            console.log(`ouro.bot@${localVersion} already published — skipping`)
            process.exit(0)
          }
          console.log(result.message)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=true\n')
          NODE

      - name: Resolve ouro.bot wrapper publish tag
        id: wrapper-publish-tag
        run: |
          TAG=$(node scripts/npm-dist-tag-policy.cjs publish-tag "ouro.bot" "$(node -p "require('./packages/ouro.bot/package.json').version")")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publishing ouro.bot with dist-tag ${TAG}"

      - name: Publish ouro.bot
        if: steps.wrapper-check.outputs.should_publish == 'true'
        run: |
          cd packages/ouro.bot
          npm publish --access public --tag "${{ steps.wrapper-publish-tag.outputs.tag }}"

      - name: Verify selected npm dist-tags
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          CLI_TAG="${{ steps.cli-publish-tag.outputs.tag }}"
          WRAPPER_TAG="${{ steps.wrapper-publish-tag.outputs.tag }}"

          verify_tag() {
            package_ref="$1"
            expected="$2"

            for attempt in 1 2 3 4 5 6; do
              actual=$(npm view "$package_ref" version 2>/dev/null || echo "")
              if [ "$actual" = "$expected" ]; then
                echo "${package_ref} verified at ${expected}"
                return 0
              fi

              if [ "$attempt" != "6" ]; then
                echo "${package_ref} points at ${actual:-missing}, expected ${expected}; retrying after npm propagation delay"
                sleep 10
              fi
            done

            echo "::error::${package_ref} points at ${actual:-missing}, expected ${expected}"
            return 1
          }

          verify_tag "@ouro.bot/cli@${CLI_TAG}" "$LOCAL"
          verify_tag "ouro.bot@${WRAPPER_TAG}" "$LOCAL"

          echo "selected npm dist-tags verified for ${LOCAL} (cli=${CLI_TAG}, wrapper=${WRAPPER_TAG})"

      - name: Smoke published package binaries
        run: npm run release:smoke
