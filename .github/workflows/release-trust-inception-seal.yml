name: release-trust-inception-seal

"on":
  workflow_dispatch:
    inputs:
      sealBodyBase64:
        required: true
        type: string
      sealBodySha256:
        required: true
        type: string

run-name: release-trust-inception-seal-${{ github.sha }}

jobs:
  seal:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable authority merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.5

      - name: Use pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.4.1
          package-manager-cache: false

      - name: Install pinned release trust dependencies
        run: npm ci --ignore-scripts

      - name: Reconstruct exact inception seal body bytes
        run: node .github/actions/release-trust/run-reconciliation.mjs materialize-seal-input release-trust-inception-seal-body.v1.json

      - name: Create keyless inception seal
        run: cosign sign-blob --yes --bundle release-trust-inception-seal.v1.sigstore.json release-trust-inception-seal-body.v1.json
