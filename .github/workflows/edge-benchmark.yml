name: edge-benchmark

# How lean the harness is on each host: install size, startup time, idle and
# peak memory, modules loaded and turn latency (.github/scripts/edge-benchmark.cjs).
# Linux runs under a 1 GiB memory cap, the size of the smallest machine we run
# on. A pull request packs both its own build and the base it merges into, and
# each host measures the two in the same job, taking turns between them, so
# how fast that runner happens to be cancels out: hosted runners of one label
# differ by up to 2x (#1786). The ratchet fails the job when a metric gets
# worse than the base by more than its noise allowance (ratchetLimit in the
# script). To land an intentional regression, label the PR
# edge-benchmark-regression-accepted and say why in its description.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    # The packed package is plain JavaScript, so one Linux job packs it for every host. On a pull request, the
    # checkout is the test merge of the change into its base, and its first parent is that base.
    name: pack (${{ matrix.side }})
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(github.event_name == 'pull_request' && '["change", "base"]' || '["change"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check out the base
        if: matrix.side == 'base'
        run: git checkout --detach HEAD^1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Pack
        # prepack builds, so this is one build.
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          git rev-parse --short HEAD > "$RUNNER_TEMP/pack/commit"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: edge-benchmark-pack-${{ matrix.side }}
          path: ${{ runner.temp }}/pack
          retention-days: 1

  bench:
    name: bench (${{ matrix.host }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: linux-x64
            runner: ubuntu-24.04
          - host: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: edge-benchmark-pack-*
          path: ${{ runner.temp }}/pack

      - name: Measure
        run: |
          pack="$RUNNER_TEMP/pack"
          bench=(node .github/scripts/edge-benchmark.cjs run --tarball "$(ls "$pack"/edge-benchmark-pack-change/*.tgz)" --out "$RUNNER_TEMP/edge-benchmark.json")
          if [ -d "$pack/edge-benchmark-pack-base" ]; then
            bench+=(--baseline-tarball "$(ls "$pack"/edge-benchmark-pack-base/*.tgz)" --baseline-out "$RUNNER_TEMP/baseline/edge-benchmark.json")
            mkdir -p "$RUNNER_TEMP/baseline"
            echo "BASELINE_LABEL=the base, $(cat "$pack/edge-benchmark-pack-base/commit"), measured alongside on this runner" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo systemd-run --scope --quiet -p MemoryMax=1G -p MemorySwapMax=0 \
              sudo -E -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" "${bench[@]}" --memory-cap-mib 1024
          else
            "${bench[@]}"
          fi

      - name: Report
        env:
          GATE: ${{ github.event_name == 'pull_request' && 'on' || 'off' }}
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'edge-benchmark-regression-accepted') && 'label edge-benchmark-regression-accepted' || '' }}
        run: |
          accepted=()
          if [ -n "$ACCEPTED" ]; then accepted=(--accepted "$ACCEPTED"); fi
          node .github/scripts/edge-benchmark.cjs report \
            --current "$RUNNER_TEMP/edge-benchmark.json" \
            --baseline "$RUNNER_TEMP/baseline/edge-benchmark.json" \
            --baseline-label "${BASELINE_LABEL:-the base}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --gate "$GATE" "${accepted[@]}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edge-benchmark-${{ matrix.host }}
          path: ${{ runner.temp }}/edge-benchmark.json
          if-no-files-found: ignore
          retention-days: 90
