name: ax-xray

# The Ouro AX X-ray checks the ouro CLI the way an agent calls it, against a loopback mock with made-up data, and the
# action claims check the declarations in actions/, and the census (scripts/ouro-census, vendored from ouro-ui) counts the agent doors
# the code has, declared or not. They write reports to artifacts named `xray`, `xray-mcp`, `xray-tools`, `actions-xray` and
# `ax-census`.
# The X-ray gates with --conformance: the job fails unless the CLI conforms.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_PORT: "4917"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build

      # scripts/ouro-census is ouro-ui's census, copied from a release; its tests run in ouro-ui. This step fails when a
      # vendored file no longer matches the hash dist-manifest.json pins, or when the checker hash those files make isn't
      # the release's (OURO_CENSUS_CHECKER), so neither a local edit nor a rewritten manifest can weaken the checker.
      # Vendoring a new release updates the files, the manifest and this hash together.
      - name: Ouro AX census matches its release
        env:
          OURO_CENSUS_CHECKER: 7e7b32a663a58af2a4a0f64d42ebe9c6e82c00e7dce69431d43a2cf44c9caa3b # ouro-ui v1.3.448
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto"), dir = "scripts/ouro-census/"
            const sha = (data) => crypto.createHash("sha256").update(data).digest("hex")
            const manifest = JSON.parse(fs.readFileSync(dir + "dist-manifest.json", "utf8"))
            const changed = Object.entries(manifest.files).filter(([file, hash]) => !fs.existsSync(dir + file) || sha(fs.readFileSync(dir + file)) !== hash)
            if (changed.length) { console.error("changed from the release: " + changed.map(([file]) => file).join(", ")); process.exit(1) }
            const checker = sha(Object.keys(manifest.files).map((file) => `${file}\n${manifest.files[file]}\n`).join(""))
            if (checker !== manifest.checker || checker !== process.env.OURO_CENSUS_CHECKER) {
              console.error(`checker ${checker}, manifest says ${manifest.checker}, release is ${process.env.OURO_CENSUS_CHECKER}`); process.exit(1)
            }
            console.log("scripts/ouro-census matches ouro-ui v1.3.448, checker " + checker)'

      # The census counts every agent door it walks and fails when one without a valid card isn't on
      # ax/census.baseline.json, when this pull request adds to the baseline, or when it drops a walker source. It
      # compares with the base commit the checked-out merge ref was built on, not the base branch's tip: the tip can
      # have moved since, and a baseline that shrank there would read as grown here (#1590). There is no override.
      - name: Ouro AX census
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p ax-census
          base_baseline=none; base_config=absent
          if [ -n "$BASE_REF" ]; then
            base_sha=$(node scripts/ouro-census/base.mts)
            git fetch --depth=1 origin "$base_sha"
            if git show FETCH_HEAD:ax/census.config.json > "$RUNNER_TEMP/base-config.json" 2>/dev/null; then base_config="$RUNNER_TEMP/base-config.json"; fi
            if git show FETCH_HEAD:ax/census.baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then base_baseline="$RUNNER_TEMP/base-baseline.json"; fi
          fi
          node scripts/ouro-census/census.mts --config ax/census.config.json --baseline ax/census.baseline.json \
            --base-baseline "$base_baseline" --base-config "$base_config" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --repo "$GITHUB_REPOSITORY" --out ax-census/census.json \
            --inventory ax-census/inventory.json 2>&1 | tee ax-census/census.txt

      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-census
          path: ax-census/
          if-no-files-found: warn

      - name: Start the made-up-data mock
        run: |
          node .github/scripts/ax-mock.mjs "$MOCK_PORT" > "$RUNNER_TEMP/mock.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$MOCK_PORT/" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mock.log"
          exit 1

      - name: Inventory from the CLI's registration
        run: node .github/scripts/ax-inventory.mjs > inventory.json

      # --conformance: the job fails unless the CLI conforms (every must claim holds, none skipped, the inventory given).
      - name: Ouro AX X-ray
        run: |
          mkdir -p xray
          node lib/ouro-ui/registry/ouro/ax/xray.ts \
            --cli "node dist/heart/daemon/ouro-entry.js" --name ouro \
            --inventory inventory.json \
            --conformance \
            --home "$RUNNER_TEMP/xray-home" \
            --env "TOOL_URL=http://127.0.0.1:$MOCK_PORT/" \
            --mock "http://127.0.0.1:$MOCK_PORT/ mock=ouroboros-ax-xray" \
            --state "session list --json" \
            --commit "$GITHUB_SHA" \
            --json --md xray/xray.md > xray/report.json

      - name: Upload the X-ray
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xray
          path: |
            xray/
            inventory.json
          if-no-files-found: warn

      # The same X-ray over `ouro mcp-serve`, the way a coding tool calls it, with the census's declared tools as the
      # inventory: every served tool must be declared, and the declared ones must behave (annotations, bad calls that
      # name the argument, an unknown tool that names a real one).
      - name: Ouro AX X-ray over mcp-serve
        run: |
          mkdir -p xray-mcp
          node lib/ouro-ui/registry/ouro/ax/xray.ts \
            --mcp "node dist/heart/daemon/ouro-entry.js mcp-serve --agent ax-xray" --name ouro \
            --inventory ax-census/inventory.json \
            --conformance \
            --home "$RUNNER_TEMP/xray-mcp-home" \
            --env "TOOL_URL=http://127.0.0.1:$MOCK_PORT/" \
            --mock "http://127.0.0.1:$MOCK_PORT/ mock=ouroboros-ax-xray" \
            --commit "$GITHUB_SHA" \
            --json --md xray-mcp/xray.md > xray-mcp/report.json

      - name: Upload the mcp-serve X-ray
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xray-mcp
          path: xray-mcp/
          if-no-files-found: warn

      # The same X-ray over the in-turn tools a model calls inside a turn, served by the dispatcher's own checks
      # (.github/scripts/ax-tools-serve.mjs, which never runs a tool), with the census's declared tools as the
      # inventory: every registered tool must have a card, and its calls must answer typed outcomes with carded codes.
      - name: Ouro AX X-ray over in-turn tools
        run: |
          mkdir -p xray-tools
          node -e "const i = require('./ax-census/inventory.json'); process.stdout.write(JSON.stringify({ tools: i.tool ?? [] }))" > xray-tools/inventory.json
          node lib/ouro-ui/registry/ouro/ax/xray.ts \
            --tools "node .github/scripts/ax-tools-serve.mjs" --name ouro \
            --inventory xray-tools/inventory.json \
            --conformance \
            --home "$RUNNER_TEMP/xray-tools-home" \
            --mock "http://127.0.0.1:$MOCK_PORT/ mock=ouroboros-ax-xray" \
            --commit "$GITHUB_SHA" \
            --json --md xray-tools/xray.md > xray-tools/report.json

      - name: Upload the in-turn tools X-ray
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xray-tools
          path: xray-tools/
          if-no-files-found: warn

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Action claims report
        run: |
          mkdir -p xray-actions
          node tools/ouro-actions/ouro-actions.mts check actions/ouro.actions.mts actions/generated \
            --report xray-actions/report.json --app "Ouroboros" --commit "$GITHUB_SHA"
          node -e "const s = require('./xray-actions/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('Action claims: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"

      - name: Upload the action claims report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actions-xray
          path: xray-actions/
          if-no-files-found: warn
