name: probe-container
on:
  pull_request:
    paths:
      - .github/workflows/probe-container.yml
env:
  IMAGE: ghcr.io/ourostack/ouroboros-probe
jobs:
  build:
    name: probe build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate
        id: release-gate
        run: echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          npm ci
          npm run build

      # Pushed by digest, with no tag: the join job below tags both architectures together, so nothing
      # carries a version or commit tag until both exist.
      - name: Build and push this architecture by digest
        if: steps.release-gate.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/unraid/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=butler-${{ matrix.arch }}
          cache-to: type=gha,scope=butler-${{ matrix.arch }},mode=max

      - name: Keep the digest for the join job
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        if: steps.release-gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  join:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Join
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" = 2
          docker buildx imagetools create -t "$IMAGE:probe-${{ github.run_id }}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:probe-${{ github.run_id }}"
          docker buildx imagetools inspect "$IMAGE:probe-${{ github.run_id }}" --format '{{json .Provenance}}' | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const p of ["linux/amd64","linux/arm64"]){const s=a[p]?.SLSA;console.log(p,"provenance",!!s?.buildDefinition?.buildType,!!s?.runDetails?.builder?.id,!!s?.runDetails?.metadata);if(!s?.buildDefinition?.buildType)process.exit(1)}'
          docker buildx imagetools inspect "$IMAGE:probe-${{ github.run_id }}" --format '{{json .SBOM}}' | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const p of ["linux/amd64","linux/arm64"]){console.log(p,"sbom",a[p]?.SPDX?.SPDXID);if(a[p]?.SPDX?.SPDXID!=="SPDXRef-DOCUMENT")process.exit(1)}'
