name: publish-container

# Builds each architecture on its own native runner once npm has published a version from this push's commit, then
# joins the two images under that version and the commit tag. Emulating arm64 took 20 to 30 minutes; a native runner
# takes a few. The image takes the version npm published from this very commit, so the package and the image never
# carry different numbers, and writes the release files under that version with the changelog npm published for it
# (scripts/release-version.cjs).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# bash -eo pipefail, so a step that pipes a command into tee or grep fails when the command does (GitHub's default
# shell has no pipefail: a failing release preflight piped into tee passed).
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/ourostack/ouroboros-butler

jobs:
  # A push that releases nothing (docs, tests, workflows) publishes nothing: its version came from an
  # earlier push, whose image already carries that tag.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout the commit with main's history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # A push publishes when any commit it brought releases something (a rebase merge's last commit may not), under
      # the version npm's publish job works out from the same push. A manual run rebuilds main's head only when npm
      # published main's version from that very commit, so an image never carries code npm did not ship under its tag.
      - name: Decide whether this push releases a version
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A manual run rebuilds main's image only; run it on main, not $GITHUB_REF."
              exit 1
            fi
            PLAN=$(node scripts/release-version.cjs dispatch)
          else
            PLAN=$(node scripts/release-version.cjs push "$BEFORE")
          fi
          printf '%s\n' "$PLAN" | tee -a "$GITHUB_OUTPUT"
          if printf '%s\n' "$PLAN" | grep -qx 'release=false'; then
            echo "This push releases nothing, so it publishes no image." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Waits for coverage.yml's publish job to put a version on npm from this commit (its coverage gate and publish
  # usually take 10 to 20 minutes; a queue of earlier releases can add more), and hands that version to the build. A
  # manual run passes at once, since its plan already checked npm published HEAD's version from HEAD. No concurrency
  # group: a run whose npm publish failed waits out its own timeout without holding up later images.
  npm-release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      version: ${{ steps.npm.outputs.version }}
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Wait for npm to publish a version from this commit
        id: npm
        env:
          RELEASE_WAIT_SECONDS: 5400
        run: node scripts/release-version.cjs wait-published | tee -a "$GITHUB_OUTPUT"

  # Every merge keeps its own build and tag, one at a time per architecture, so a busy hour never drops a version's
  # image.
  build:
    name: build (${{ matrix.arch }})
    needs:
      - plan
      - npm-release
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    concurrency:
      group: container-publish-build-${{ matrix.arch }}-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the commit with main's history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve immutable image references
        run: |
          PACKAGE_VERSION="${{ needs.npm-release.outputs.version }}"
          test -n "$PACKAGE_VERSION"
          {
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "VERSION_IMAGE=$IMAGE:$PACKAGE_VERSION"
            echo "SHA_IMAGE=$IMAGE:sha-${{ github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ghcr-authorization-retry.sh bash -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin'

      - name: Gate immutable references before build
        id: release-gate
        run: |
          GATE_OUTPUT=$(scripts/container-image-release-gate.sh "$VERSION_IMAGE" "$SHA_IMAGE")
          printf '%s\n' "$GATE_OUTPUT"
          PUBLISH=$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "publish" { print $2 }')
          test "$PUBLISH" = "true" || test "$PUBLISH" = "false"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      # The image carries package.json, changelog.json and the Sanctuary deploy files, so they are written into this
      # checkout before the build, under the version npm published from this commit and with the changelog.json that
      # npm published for it, so the package, the image and the GitHub release all carry the same changelog.
      - name: Build release assets
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          npm ci
          test "$(node scripts/release-version.cjs apply --version "$PACKAGE_VERSION" --npm-changelog)" = "$PACKAGE_VERSION"
          node scripts/changelog-gate.cjs
          npm run build

      # Pushed by digest, with no tag: the join job below tags both architectures together, so nothing
      # carries a version or commit tag until both exist. GHCR sometimes denies a valid token with a bare
      # "denied: denied" that passes a moment later, so the push gets up to three attempts; any other
      # failure stops at the first.
      - name: Build and push this architecture by digest
        if: steps.release-gate.outputs.publish == 'true'
        id: build-1
        continue-on-error: true
        uses: docker/build-push-action@v6
        with: &build-push-inputs
          context: .
          file: deploy/unraid/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=butler-${{ matrix.arch }}
          cache-to: type=gha,scope=butler-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Retry only a GHCR authorization denial (attempt 2 of 3)
        if: steps.release-gate.outputs.publish == 'true' && steps.build-1.outcome == 'failure'
        id: retry-2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_DELAY: 10
        run: &retry-denied-push |
          docker buildx history inspect >"$RUNNER_TEMP/failed-build.txt" 2>&1 || true
          cat "$RUNNER_TEMP/failed-build.txt"
          if ! scripts/ghcr-authorization-retry.sh --is-denial "$RUNNER_TEMP/failed-build.txt"; then
            echo "::error::The build failed for a reason other than a GHCR authorization denial; see the step above."
            exit 1
          fi
          sleep "$RETRY_DELAY"
          scripts/ghcr-authorization-retry.sh bash -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin'

      - name: Build and push this architecture by digest (attempt 2 of 3)
        if: steps.retry-2.outcome == 'success'
        id: build-2
        continue-on-error: true
        uses: docker/build-push-action@v6
        with: *build-push-inputs

      - name: Retry only a GHCR authorization denial (attempt 3 of 3)
        if: steps.build-2.outcome == 'failure'
        id: retry-3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRY_DELAY: 30
        run: *retry-denied-push

      - name: Build and push this architecture by digest (attempt 3 of 3)
        if: steps.retry-3.outcome == 'success'
        id: build-3
        uses: docker/build-push-action@v6
        with: *build-push-inputs

      # ignore-error=true on cache-to drops only a failed cache export (the GitHub Actions cache service can
      # answer "internal"); a failed push, attestation or solve still fails the build above. Say so when the
      # cache export failed. This runs only after a successful build, so it never hides a failure.
      - name: Warn if the build cache export failed
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          if docker buildx history logs --progress plain >"$RUNNER_TEMP/build-log.txt" 2>&1; then
            scripts/container-cache-export-warning.sh "$RUNNER_TEMP/build-log.txt"
          else
            echo "::warning::Could not read the build log, so whether the build cache export succeeded is unknown."
          fi

      - name: Keep the digest for the join job
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build-1.outputs.digest || steps.build-2.outputs.digest || steps.build-3.outputs.digest }}"
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        if: steps.release-gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - plan
      - npm-release
      - build
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: container-publish-tag-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve immutable image references
        run: |
          PACKAGE_VERSION="${{ needs.npm-release.outputs.version }}"
          test -n "$PACKAGE_VERSION"
          {
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
            echo "VERSION_IMAGE=$IMAGE:$PACKAGE_VERSION"
            echo "SHA_IMAGE=$IMAGE:sha-${{ github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ghcr-authorization-retry.sh bash -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin'

      - name: Gate immutable references before tagging
        id: release-gate
        run: |
          GATE_OUTPUT=$(scripts/container-image-release-gate.sh "$VERSION_IMAGE" "$SHA_IMAGE")
          printf '%s\n' "$GATE_OUTPUT"
          PUBLISH=$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "publish" { print $2 }')
          test "$PUBLISH" = "true" || test "$PUBLISH" = "false"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Download both architectures' digests
        if: steps.release-gate.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Tag one image for linux/amd64 and linux/arm64
        if: steps.release-gate.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" = 2
          "$GITHUB_WORKSPACE/scripts/ghcr-authorization-retry.sh" docker buildx imagetools create -t "$VERSION_IMAGE" -t "$SHA_IMAGE" $(printf "$IMAGE@sha256:%s " *)

      - name: Verify exact immutable references
        if: steps.release-gate.outputs.publish == 'true'
        id: exact-references
        run: |
          # The registry can answer a read just after our own push as not found; the same strict gate is repeated, bounded.
          for attempt in 1 2 3 4 5 6; do
            if GATE_OUTPUT=$(scripts/container-image-release-gate.sh "$VERSION_IMAGE" "$SHA_IMAGE"); then break; fi
            test "$attempt" -lt 6
            sleep 10
          done
          printf '%s\n' "$GATE_OUTPUT"
          test "$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "publish" { print $2 }')" = "false"
          DIGEST=$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "digest" { print $2 }')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify package visibility and architectures
        if: steps.release-gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VISIBILITY=$(gh api /orgs/ourostack/packages/container/ouroboros-butler --jq .visibility)
          test "$VISIBILITY" = "public"

          AUTHENTICATED_MANIFEST=$(docker buildx imagetools inspect "$VERSION_IMAGE")
          printf '%s\n' "$AUTHENTICATED_MANIFEST" | grep -F "Platform:    linux/amd64"
          printf '%s\n' "$AUTHENTICATED_MANIFEST" | grep -F "Platform:    linux/arm64"

      - name: Verify anonymous immutable references and authenticated attestations
        if: steps.release-gate.outputs.publish == 'true'
        run: |
          verify_exact_attestations() {
            EXACT_IMAGE=$1
            # Node's readFileSync(0, "utf8") on a pipe overflows the heap on short reads
            # (nodejs/node#66341, runner Node 24); read regular files instead.
            ATTESTATIONS_DIR=$(mktemp -d)
            docker buildx imagetools inspect "$EXACT_IMAGE" --format '{{json .Provenance}}' > "$ATTESTATIONS_DIR/provenance.json"
            docker buildx imagetools inspect "$EXACT_IMAGE" --format '{{json .SBOM}}' > "$ATTESTATIONS_DIR/sbom.json"
            node -e '
              const fs = require("node:fs");
              const attestations = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const platform of ["linux/amd64", "linux/arm64"]) {
                const slsa = attestations[platform]?.SLSA;
                if (typeof slsa?.buildDefinition?.buildType !== "string" || slsa.buildDefinition.buildType.length === 0) process.exit(1);
                if (typeof slsa?.runDetails?.builder?.id !== "string" || slsa.runDetails.builder.id.length === 0) process.exit(1);
                if (!slsa?.runDetails?.metadata || typeof slsa.runDetails.metadata !== "object") process.exit(1);
              }
            ' "$ATTESTATIONS_DIR/provenance.json"
            node -e '
              const fs = require("node:fs");
              const attestations = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const platform of ["linux/amd64", "linux/arm64"]) {
                if (attestations[platform]?.SPDX?.SPDXID !== "SPDXRef-DOCUMENT") process.exit(1);
              }
            ' "$ATTESTATIONS_DIR/sbom.json"
            rm -rf "$ATTESTATIONS_DIR"
          }
          EXACT_IMAGE="$VERSION_IMAGE@${{ steps.exact-references.outputs.digest }}"
          verify_exact_attestations "$EXACT_IMAGE"
          docker logout ghcr.io
          GATE_OUTPUT=$(scripts/container-image-release-gate.sh "$VERSION_IMAGE" "$SHA_IMAGE")
          printf '%s\n' "$GATE_OUTPUT"
          test "$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "publish" { print $2 }')" = "false"
          PUBLIC_DIGEST=$(printf '%s\n' "$GATE_OUTPUT" | awk -F= '$1 == "digest" { print $2 }')
          test "$PUBLIC_DIGEST" = "${{ steps.exact-references.outputs.digest }}"
          verify_exact_attestations "$EXACT_IMAGE"
